name: Watch beta APK
on:
  push:
    branches: [main, feat/firstrep-watch-beta]
    paths: ['wearos/**', '.github/workflows/watch-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build
        working-directory: wearos
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: firstrep-watch-beta
          path: wearos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-test-reports
          path: |
            wearos/app/build/reports/tests/
            wearos/app/build/reports/lint-results-debug.html
          retention-days: 14
